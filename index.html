<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#156f59"><title>ワリカン！</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#20342e;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 15px}.sub{font-size:12px;color:#6a8177;margin-top:4px}.card{background:white;border-radius:20px;padding:19px;margin:14px 0;box-shadow:0 3px 15px #174b2a0b}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}input,select{width:100%;padding:13px;border:1px solid #d6e1da;border-radius:11px;font-size:16px;background:white;color:#20342e}label{font-size:13px;font-weight:650;display:block;margin:13px 0 7px}button{border:0;border-radius:11px;background:#167458;color:white;font-weight:700;padding:13px 16px;font-size:15px;cursor:pointer}button.secondary{background:#eaf3ee;color:#17694e}button.danger{background:#fff0ef;color:#b5423b}button.small{padding:8px 10px;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.chip{border:1px solid #d5e4d9;background:#f7faf7;color:#486355;border-radius:999px;padding:10px 13px}.chip.on{background:#167458;color:white;border-color:#167458}.muted{color:#728379;font-size:13px}.item{border-top:1px solid #edf1ed;padding:13px 0}.item:first-child{border:0}.money{font-weight:800;font-variant-numeric:tabular-nums}.big{font-size:29px;font-weight:800;color:#166d53}.notice{font-size:12px;color:#667d6f;line-height:1.6}.badge{background:#e4f3e9;color:#196d4f;border-radius:99px;padding:5px 9px;font-size:12px}img.receipt{max-width:120px;max-height:130px;border-radius:9px;margin-top:8px}.summary{background:#e7f5ec;border-radius:14px;padding:15px;margin:10px 0}.settle{border-top:1px solid #d4e6d9;padding:12px 0;font-weight:700}.hidden{display:none} .footer{font-size:12px;text-align:center;color:#78897e;margin-top:25px}button:disabled{opacity:.4} .check{display:flex;align-items:center;gap:8px;margin:7px 0}.check input{width:20px;height:20px} .pill{background:#eaf2ed;border-radius:9px;padding:8px 12px;white-space:nowrap}
</style></head><body><main><header><div><h1>🍻 ワリカン！</h1><div class="sub">飲み会の精算、これひとつ。</div></div><button class="secondary small" id="reset">新しい飲み会</button></header>
<section class="card"><h2>① 飲み会の参加者</h2><div class="row"><input id="personName" placeholder="名前（例：たろう）" maxlength="25"><button id="addPerson">追加</button></div><div id="people" class="chips"></div><p class="notice">名前を追加してね。参加者はあとから追加できるよ。</p></section>
<section class="card"><h2>② 支払いを記録</h2><label for="shop">お店の名前</label><input id="shop" placeholder="例：居酒屋〇〇" maxlength="70"><label for="amount">支払った金額（円）</label><input id="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="例：12000"><label for="payer">誰が払った？</label><select id="payer"></select><label>誰と割り勘する？（対象者を選択）</label><div id="splitPeople" class="chips"></div><p class="notice">全員で割るなら全員選択。参加していない人はタップして外してね。</p><label for="receipt">レシート写真（任意）</label><input id="receipt" type="file" accept="image/*" capture="environment"><p class="notice">写真はこの端末内だけに保存されます。文字の自動読み取りは未対応です。</p><button id="addExpense" style="width:100%;margin-top:12px">＋ 支払いを記録する</button></section>
<section class="card"><div class="row between"><h2>③ 支払い履歴</h2><span class="badge" id="expenseCount">0件</span></div><div id="expenses"><p class="muted">まだ支払いはありません。</p></div></section>
<section class="card"><h2>④ 最終精算</h2><div class="summary"><div class="muted">飲み会の合計</div><div class="big" id="total">¥0</div></div><div id="balances"></div><h2 style="margin-top:18px">誰が誰に払う？</h2><div id="settlements" class="muted">支払いを記録すると表示されるよ。</div><button class="secondary" id="copy" style="width:100%;margin-top:14px">精算結果をコピー</button></section><p class="footer">データはこのブラウザ内に保存されます。端末間共有は次のバージョンで対応予定。</p></main>
<script>
const KEY='warikan_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.people)||!Array.isArray(state.expenses))state={people:[],expenses:[]};let selected=new Set(state.people.map(p=>p.id));const $=id=>document.getElementById(id);const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const name=id=>state.people.find(p=>p.id===id)?.name||'削除済み';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('保存容量が不足しました。写真を小さくするか、写真なしで記録してください。');return false}};
function render(){selected=new Set([...selected].filter(id=>state.people.some(p=>p.id===id)));$('people').innerHTML=state.people.map(p=>`<span class="pill">${esc(p.name)} <button class="danger small" data-delperson="${p.id}" aria-label="削除">×</button></span>`).join('')||'<span class="muted">まだ参加者がいません</span>';$('payer').innerHTML=state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('splitPeople').innerHTML=state.people.map(p=>`<button type="button" class="chip ${selected.has(p.id)?'on':''}" data-split="${p.id}">${esc(p.name)} ${selected.has(p.id)?'✓':''}</button>`).join('');$('expenseCount').textContent=state.expenses.length+'件';$('expenses').innerHTML=state.expenses.length?state.expenses.map(e=>`<div class="item"><div class="row between"><div class="grow"><strong>${esc(e.shop)}</strong><div class="muted">${esc(name(e.payer))}が支払い · 対象：${e.split.map(name).map(esc).join('、')}</div><div class="muted">${new Date(e.date).toLocaleString('ja-JP')}</div>${e.photo?`<img class="receipt" src="${e.photo}" alt="レシート">`:''}</div><div style="text-align:right"><div class="money">${yen(e.amount)}</div><button class="danger small" data-delexpense="${e.id}" style="margin-top:8px">削除</button></div></div></div>`).join(''):'<p class="muted">まだ支払いはありません。</p>';calculate()}
function calculate(){let bal=Object.fromEntries(state.people.map(p=>[p.id,0]));let total=0;for(const e of state.expenses){total+=e.amount;if(!(e.payer in bal))continue;bal[e.payer]+=e.amount;let base=Math.floor(e.amount/e.split.length),rem=e.amount%e.split.length;e.split.forEach((id,i)=>{if(id in bal)bal[id]-=base+(i<rem?1:0)})}$('total').textContent=yen(total);$('balances').innerHTML=state.people.map(p=>`<div class="row between item"><span>${esc(p.name)}</span><span class="money" style="color:${bal[p.id]>=0?'#167458':'#b5423b'}">${bal[p.id]>0?'受取 ':bal[p.id]<0?'支払 ':'精算済み '}${yen(Math.abs(bal[p.id]))}</span></div>`).join('');let debt=Object.entries(bal).filter(x=>x[1]<0).map(([id,v])=>({id,n:-v})),cred=Object.entries(bal).filter(x=>x[1]>0).map(([id,v])=>({id,n:v})),out=[];let i=0,j=0;while(i<debt.length&&j<cred.length){let n=Math.min(debt[i].n,cred[j].n);if(n>0)out.push({from:debt[i].id,to:cred[j].id,n});debt[i].n-=n;cred[j].n-=n;if(!debt[i].n)i++;if(!cred[j].n)j++}window.settlementText='【ワリカン！精算結果】\n合計 '+yen(total)+'\n'+(out.map(x=>`${name(x.from)} → ${name(x.to)}：${yen(x.n)}`).join('\n')||'精算不要');$('settlements').innerHTML=out.map(x=>`<div class="settle">${esc(name(x.from))} → ${esc(name(x.to))}<br><span class="big" style="font-size:20px">${yen(x.n)}</span></div>`).join('')||(state.expenses.length?'精算不要！ 全員ぴったり。':'支払いを記録すると表示されるよ。')}
$('addPerson').onclick=()=>{let n=$('personName').value.trim();if(!n)return alert('名前を入力してね');if(state.people.some(p=>p.name===n))return alert('同じ名前の参加者がいます');let id=crypto.randomUUID();state.people.push({id,name:n});selected.add(id);if(!save()){state.people.pop();return}$('personName').value='';render()};$('personName').onkeydown=e=>{if(e.key==='Enter')$('addPerson').click()};$('people').onclick=e=>{let id=e.target.dataset.delperson;if(!id)return;if(state.expenses.some(x=>x.payer===id||x.split.includes(id)))return alert('支払い履歴に使われている参加者は削除できません');if(!confirm(name(id)+'さんを削除する？'))return;state.people=state.people.filter(p=>p.id!==id);selected.delete(id);save();render()};$('splitPeople').onclick=e=>{let b=e.target.closest('[data-split]');if(!b)return;let id=b.dataset.split;selected.has(id)?selected.delete(id):selected.add(id);let payer=$('payer').value;render();$('payer').value=payer};
async function photoData(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('画像ファイルを選んでね');return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.55))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('画像を読み込めませんでした'))};img.src=url})}
$('addExpense').onclick=async()=>{let shop=$('shop').value.trim(),amount=Number($('amount').value),payer=$('payer').value,split=[...selected];if(!state.people.length)return alert('先に参加者を登録してね');if(!shop)return alert('お店の名前を入力してね');if(!Number.isSafeInteger(amount)||amount<=0)return alert('金額は1円以上の整数で入力してね');if(!payer||!split.length)return alert('支払った人と割り勘する人を選んでね');let btn=$('addExpense');btn.disabled=true;try{let photo=await photoData($('receipt').files[0]);let e={id:crypto.randomUUID(),shop,amount,payer,split,photo,date:new Date().toISOString()};state.expenses.unshift(e);if(!save()){state.expenses.shift();return}$('shop').value='';$('amount').value='';$('receipt').value='';render()}catch(e){alert(e.message)}finally{btn.disabled=false}};$('expenses').onclick=e=>{let id=e.target.dataset.delexpense;if(!id||!confirm('この支払いを削除する？'))return;state.expenses=state.expenses.filter(x=>x.id!==id);save();render()};$('reset').onclick=()=>{if(!confirm('新しい飲み会を始める？ 現在の参加者・支払い履歴は削除され、元に戻せません。'))return;state={people:[],expenses:[]};selected.clear();save();render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(window.settlementText);alert('コピーしたよ！LINEに貼り付けて共有できるよ')}catch{prompt('以下をコピーしてね',window.settlementText)}};render();
</script></body></html>
